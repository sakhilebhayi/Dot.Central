name: Deploy to Production

# Runs automatically after the CI workflow finishes GREEN on main (every
# merge), and manually from the Actions tab with a typed confirmation to
# redeploy the current main. Run bootstrap.yml once first on a new server:
# this workflow assumes .env, the database, the docroot wiring and the
# cron lines already exist.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deploying main to production'
        required: true

concurrency:
  group: central-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to central.infodot.co.za
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only a successful CI run deploys; a manual run must be confirmed.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --silent
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy code and run migrations
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php
          DOCROOT="$(dirname "$DEPLOY_PATH")"

          echo "== Current release: $(git rev-parse --short HEAD)"
          git fetch origin main

          # Maintenance mode only for the risky window (migrations).
          $PHP artisan down --retry=30 || true

          git reset --hard origin/main
          composer install --no-interaction --optimize-autoloader --no-dev

          $PHP artisan migrate --force

          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache

          for target in build images favicon-16x16.png favicon-32x32.png apple-touch-icon.png robots.txt; do
            ln -sfn "central/public/${target}" "$DOCROOT/${target}"
          done
          DEPLOY

      - name: Transfer built assets
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            public/build/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/public/build/"

      - name: Restart workers and go live
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'RESTART'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php
          # ---- crontab: repair this app's lines, never touch anyone else's ----
          # Rule for this account: the crontab is written only by deploy
          # workflows, each touches only lines carrying its own marker, and a
          # write is verified before and after. 2026-08-31: a pipeline whose read
          # failed installed an EMPTY crontab and silently killed Dot.Mines'
          # scheduler for six weeks. cron runs with a minimal PATH, so lines carry
          # the absolute PHP path and keep their last output in a log file.
          MARK="# dot-central"
          # One writer at a time on this account: deploys of different apps can
          # coincide and would otherwise race on the single crontab.
          command -v flock > /dev/null || { echo "::error::flock is not installed on the host; crontab writes cannot be serialised"; exit 1; }
          exec 9>"$HOME/.dot-crontab.lock"; flock -w 120 9 || { echo "::error::could not take the crontab lock within 120 s (another deploy is writing the crontab)"; exit 1; }
          PHP_BIN="$(command -v "${PHP:-php}")"
          OLD="$(mktemp)"; NEW="$(mktemp)"; CHK="$(mktemp)"; ERR="$(mktemp)"
          # crontab -l on this host can transiently answer empty (seen 2026-10-16,
          # right after a write, under the lock). A read is trusted only when it
          # is non-empty or the host says there is no crontab; otherwise retry.
          read_crontab() {
            local i
            for i in 1 2 3 4 5; do
              if crontab -l > "$1" 2> "$ERR"; then
                [ -s "$1" ] && return 0
              elif grep -qi "no crontab for" "$ERR"; then
                : > "$1"; return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! read_crontab "$OLD"; then
            echo "::error::crontab -l answered empty or failed five times ($(cat "$ERR")). Refusing to write a crontab I could not read."; exit 1
          fi
          KEY="${MARK#\# dot-}"
          EXPECT_MINE=2
          OTHERS=$(grep -v "$MARK" "$OLD" | grep -c . || true)
          {
            grep -v "$MARK" "$OLD" || true
            echo "* * * * * cd $DEPLOY_PATH && exec $PHP_BIN artisan schedule:run > storage/logs/cron-scheduler.log 2>&1 $MARK"
            echo "* * * * * cd $DEPLOY_PATH && exec $PHP_BIN artisan queue:work --stop-when-empty --tries=3 --max-time=50 > storage/logs/cron-queue.log 2>&1 $MARK"
          } > "$NEW"
          # Runner mode (InfoDot docs/programme R-1): when the account runs the bounded-concurrency cron runner
          # (InfoDot: Cron Runner workflow, "install"), this app's commands go to ~/.dot-cron.d/$KEY.cron and the
          # runner starts them, at most 4 at a time, away from second 0. Its own crontab lines are removed (a migration
          # on deploy). Without the runner the lines above are installed as before.
          if [ -x "$HOME/bin/dot-cron-runner" ] && grep -q '# dot-cron-runner' "$OLD"; then
            CMDS="$(grep -F -- "$MARK" "$NEW" | sed -E 's/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ //; s/ *# dot-[a-z0-9-]*$//' || true)"
            mkdir -p "$HOME/.dot-cron.d"
            if [ -n "$CMDS" ]; then
              printf '%s\n' "$CMDS" > "$HOME/.dot-cron.d/$KEY.cron.tmp" && mv "$HOME/.dot-cron.d/$KEY.cron.tmp" "$HOME/.dot-cron.d/$KEY.cron"
            else
              rm -f "$HOME/.dot-cron.d/$KEY.cron"
            fi
            grep -v -F -- "$MARK" "$NEW" > "$NEW.t" || true; mv "$NEW.t" "$NEW"
            EXPECT_MINE=0
            echo "== runner mode: $(printf '%s' "$CMDS" | grep -c . || true) command(s) written to ~/.dot-cron.d/$KEY.cron, none left in the crontab"
          fi
          crontab "$NEW"
          read_crontab "$CHK" || : > "$CHK"
          AFTER=$(grep -v "$MARK" "$CHK" | grep -c . || true)
          MINE=$(grep -c "$MARK" "$CHK" || true)
          if [ "$AFTER" != "$OTHERS" ] || [ "$MINE" != "$EXPECT_MINE" ]; then
            crontab "$OLD"
            echo "::error::crontab verification failed (other lines before=$OTHERS after=$AFTER, mine=$MINE, expected=$EXPECT_MINE); the previous crontab was restored."; exit 1
          fi
          rm -f "$OLD" "$NEW" "$CHK" "$ERR"; flock -u 9
          echo "== crontab: $MINE line(s) for $MARK installed, $OTHERS other line(s) preserved"

          # The cron-driven worker exits when idle and starts fresh each
          # minute; queue:restart makes a running one finish and exit now.
          $PHP artisan queue:restart
          $PHP artisan up
          echo "== Deployed: $(git rev-parse --short HEAD)"
          RESTART

      - name: Health check
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ secrets.DEPLOY_HOST }}/up")
          echo "GET /up -> ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed on /up (HTTP ${code}). The site may still be in maintenance mode or the release is unhealthy."
            exit 1
          fi

      - name: Failure notice
        if: failure()
        run: |
          echo '::error::Deploy failed. If it failed during or after migrations the site may have been left in maintenance mode on purpose -- inspect the server before running `php artisan up`.'

      - name: Probe the application folder from outside
        # Public requests only (no SSH, nothing is read): the app folder next to the docroot
        # must answer 403/404 (or a 301/302 to the login), never 200. Found 2026-10-20
        # serving its database, logs and vendor/ on four platforms. Runs after the site is
        # live again, so it can only turn the run red. Only status codes are printed.
        env:
          SITE_URL: https://${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          KEY="$(basename "$DEPLOY_PATH")"
          [ -n "$KEY" ] && [ "$KEY" != "/" ] || { echo "::error::cannot work out the app folder name; the probe did not run"; exit 1; }
          EXPOSED=0
          UNREACHED=0
          for P in .env .env.bak-secrets artisan composer.json composer.lock database/database.sqlite storage/logs/laravel.log vendor/autoload.php phpunit.xml; do
            CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$SITE_URL/$KEY/$P" || true)
            case "$CODE" in
              200) echo "::error::EXPOSED /$KEY/$P answered 200"; EXPOSED=1 ;;
              000) echo "000 /$KEY/$P (no answer)"; UNREACHED=$((UNREACHED + 1)) ;;
              *) echo "$CODE /$KEY/$P" ;;
            esac
          done
          [ "$UNREACHED" -eq 0 ] || echo "::warning::$UNREACHED probe request(s) got no answer; those paths are unverified."
          if [ "$EXPOSED" -ne 0 ]; then
            echo "::error::The application folder is readable over HTTP (database, logs or vendor/ may be downloadable). Run the App Folder Guard workflow in InfoDot (mode apply) or add the deny file by hand, then re-run."
            exit 1
          fi
          echo "== App-folder probe: no sensitive path answered 200 ($((9 - UNREACHED)) of 9 paths verified)."

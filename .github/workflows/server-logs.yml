name: Server Logs

# Read-only: tail the newest Laravel log so failures are diagnosable
# without shell access. Fixed command on purpose; this workflow must never
# become a general remote shell.
on:
  workflow_dispatch:

jobs:
  logs:
    name: Tail latest Laravel log
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Tail log
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'LOGS'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          # The application log, not whichever file was written last: the cron
          # logs are rewritten every minute and would always win.
          latest=$(ls -1t storage/logs/laravel*.log 2>/dev/null | head -1 || true)
          if [ -z "$latest" ]; then
            echo "No application log (storage/logs/laravel*.log) yet."
            exit 0
          fi
          echo "== $latest (last 120 lines)"
          tail -120 "$latest"
          LOGS

      - name: Cron diagnostics
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'CRON'
          set -uo pipefail
          cd "$DEPLOY_PATH"
          echo "== crontab lines for this app"
          crontab -l 2>/dev/null | grep "# dot-central" || echo "(none)"
          echo "== php resolved by a login shell: $(command -v php) -> $(php -v 2>/dev/null | head -1)"
          echo "== php resolved with cron's minimal PATH: $(env -i PATH=/usr/bin:/bin sh -c 'command -v php || echo "not found"')"
          for f in storage/logs/cron-scheduler.log storage/logs/cron-queue.log; do
            echo "== $f"
            if [ -f "$f" ]; then
              stat -c 'last written %y' "$f" 2>/dev/null || true
              tail -20 "$f"
            else
              echo "(missing: the cron line has not run since the bootstrap wrote it)"
            fi
          done
          CRON

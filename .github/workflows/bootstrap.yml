name: Bootstrap Production

# One-time first deployment of Dot.Central to central.infodot.co.za on the
# shared cPanel account, following the layout live for Dot.Mines and
# Dot.Dopemine: the docroot is ~/central.infodot.co.za, the repository
# lives at <docroot>/central (DEPLOY_PATH), and the docroot gets an
# index.php shim, a copy of public/.htaccess and symlinks into
# central/public. SQLite by decision (2026-10-16): almost everything is
# rebuilt from Dot.Mines; what is not (shifts, line-ups, audit log) is
# copied nightly by cron. Safe to re-run: every step is idempotent and
# .env is never overwritten.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "bootstrap" to confirm first-time production setup'
        required: true

concurrency:
  group: central-production-deploy
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap central.infodot.co.za
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Refuse unconfirmed runs
        if: ${{ github.event.inputs.confirm != 'bootstrap' }}
        run: |
          echo '::error::Confirmation input was not "bootstrap" -- aborting.'
          exit 1

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --silent
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Clone, install, configure, migrate, wire the docroot
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'BOOTSTRAP'
          set -euo pipefail
          APP="$DEPLOY_PATH"
          DOCROOT="$(dirname "$APP")"
          PHP=php

          echo "== PHP: $($PHP -v | head -1)"
          mkdir -p "$DOCROOT"

          if [ ! -d "$APP/.git" ]; then
            git clone https://github.com/sakhilebhayi/Dot.Central.git "$APP"
          else
            git -C "$APP" fetch origin main
            git -C "$APP" reset --hard origin/main
          fi
          cd "$APP"

          composer install --no-interaction --optimize-autoloader --no-dev

          # Nothing in this file is secret: APP_KEY is generated on the
          # server right after, and the database is a local file.
          if [ ! -f .env ]; then
            cat > .env <<'ENV'
          APP_NAME="Dot.Central"
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=https://central.infodot.co.za

          LOG_CHANNEL=daily
          LOG_LEVEL=info

          DB_CONNECTION=sqlite

          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_SECURE_COOKIE=true

          CACHE_STORE=database
          QUEUE_CONNECTION=database

          MAIL_MAILER=log
          ENV
            chmod 600 .env
            $PHP artisan key:generate --force
          fi

          mkdir -p database storage/backups
          touch database/database.sqlite

          $PHP artisan migrate --force
          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache

          # Docroot wiring: keep the static placeholder page as a backup,
          # then shim, rewrite rules and asset links (idempotent).
          if [ -f "$DOCROOT/index.html" ]; then
            mv -f "$DOCROOT/index.html" "$DOCROOT/index.coming-soon.bak"
          fi
          cat > "$DOCROOT/index.php" <<'SHIM'
          <?php require __DIR__.'/central/public/index.php';
          SHIM
          cp "$APP/public/.htaccess" "$DOCROOT/.htaccess"
          for target in build images favicon-16x16.png favicon-32x32.png apple-touch-icon.png robots.txt; do
            ln -sfn "central/public/${target}" "$DOCROOT/${target}"
          done

          # ---- crontab: repair this app's lines, never touch anyone else's ----
          # Rule for this account: the crontab is written only by deploy
          # workflows, each touches only lines carrying its own marker, and a
          # write is verified before and after. 2026-08-31: a pipeline whose read
          # failed installed an EMPTY crontab and silently killed Dot.Mines'
          # scheduler for six weeks. cron runs with a minimal PATH, so lines carry
          # the absolute PHP path and keep their last output in a log file.
          MARK="# dot-central"
          # One writer at a time on this account: deploys of different apps can
          # coincide and would otherwise race on the single crontab.
          command -v flock > /dev/null || { echo "::error::flock is not installed on the host; crontab writes cannot be serialised"; exit 1; }
          exec 9>"$HOME/.dot-crontab.lock"; flock -w 120 9 || { echo "::error::could not take the crontab lock within 120 s (another deploy is writing the crontab)"; exit 1; }
          PHP_BIN="$(command -v "${PHP:-php}")"
          OLD="$(mktemp)"; NEW="$(mktemp)"; CHK="$(mktemp)"; ERR="$(mktemp)"
          # crontab -l on this host can transiently answer empty (seen 2026-10-16,
          # right after a write, under the lock). A read is trusted only when it
          # is non-empty or the host says there is no crontab; otherwise retry.
          read_crontab() {
            local i
            for i in 1 2 3 4 5; do
              if crontab -l > "$1" 2> "$ERR"; then
                [ -s "$1" ] && return 0
              elif grep -qi "no crontab for" "$ERR"; then
                : > "$1"; return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! read_crontab "$OLD"; then
            echo "::error::crontab -l answered empty or failed five times ($(cat "$ERR")). Refusing to write a crontab I could not read."; exit 1
          fi
          OTHERS=$(grep -v "$MARK" "$OLD" | grep -c . || true)
          {
            grep -v "$MARK" "$OLD" || true
            echo "* * * * * cd $APP && $PHP_BIN artisan schedule:run > storage/logs/cron-scheduler.log 2>&1 $MARK"
            echo "* * * * * cd $APP && $PHP_BIN artisan queue:work --stop-when-empty --tries=3 --max-time=50 > storage/logs/cron-queue.log 2>&1 $MARK"
          } > "$NEW"
          crontab "$NEW"
          read_crontab "$CHK" || : > "$CHK"
          AFTER=$(grep -v "$MARK" "$CHK" | grep -c . || true)
          MINE=$(grep -c "$MARK" "$CHK" || true)
          if [ "$AFTER" != "$OTHERS" ] || [ "$MINE" != "2" ]; then
            crontab "$OLD"
            echo "::error::crontab verification failed (other lines before=$OTHERS after=$AFTER, mine=$MINE); the previous crontab was restored."; exit 1
          fi
          rm -f "$OLD" "$NEW" "$CHK" "$ERR"; flock -u 9
          echo "== crontab: $MINE line(s) for $MARK installed, $OTHERS other line(s) preserved"

          echo "== Code deployed: $(git rev-parse --short HEAD)"
          BOOTSTRAP

      - name: Transfer built assets
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            public/build/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/public/build/"

      - name: Health check
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ secrets.DEPLOY_HOST }}/up")
          echo "GET /up -> ${code}"
          [ "$code" = "200" ] || { echo "::error::The application did not answer 200 on /up."; exit 1; }
          denied=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ secrets.DEPLOY_HOST }}/central/database/database.sqlite")
          echo "GET /central/database/database.sqlite -> ${denied}"
          [ "$denied" = "403" ] || [ "$denied" = "404" ] || { echo "::error::The application directory is reachable over HTTP."; exit 1; }
